<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B.K.A | Contact</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .contact-hero{
      max-width:920px;
      margin:8px auto 0;
      padding:0 24px;
    }
    .contact-hero .frame{
      position:relative;
      overflow:hidden;
      background:repeating-linear-gradient(90deg,
        var(--paper-dim) 0, var(--paper-dim) 8px, var(--paper) 8px, var(--paper) 14px,
        var(--paper-dim) 14px, var(--paper-dim) 26px, var(--paper) 26px, var(--paper) 30px,
        var(--paper-dim) 30px, var(--paper-dim) 34px, var(--paper) 34px, var(--paper) 44px,
        var(--paper-dim) 44px, var(--paper-dim) 60px, var(--paper) 60px, var(--paper) 64px);
      box-shadow:0 30px 60px -30px rgba(23,19,16,0.25);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:60px 24px;
    }
    .contact-wrap{
      position:relative;
      z-index:1;
      max-width:480px;
      margin:0;
      padding:0;
      display:flex;
      flex-direction:column;
      gap:18px;
      width:100%;
    }
    .contact-item{
      display:flex;
      align-items:center;
      gap:14px;
      padding:16px 18px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--paper);
      transition:border-color 0.3s ease, background 0.3s ease, backdrop-filter 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }
    .contact-item:hover{
      border-color:rgba(255,255,255,0.5);
      background:rgba(255,255,255,0.35);
      backdrop-filter:blur(10px) saturate(1.6);
      -webkit-backdrop-filter:blur(10px) saturate(1.6);
      box-shadow:0 8px 24px -8px rgba(23,19,16,0.25), inset 0 1px 0 rgba(255,255,255,0.6);
      transform:translateY(-2px);
    }
    .contact-item a{
      color:var(--ink);
      text-decoration:none;
      font-weight:500;
      font-size:16px;
    }
    .icon{
      width:22px; height:22px;
      fill:var(--brick);
      flex-shrink:0;
    }
    @media (max-width:640px){
      .contact-hero .frame{ padding:40px 16px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <h1 class="mark">B.K.A</h1>
    <p class="byline">Bahman Kiani Azad</p>
    <p class="role">Painter</p>
    <hr class="header-rule">
    <nav class="site-nav">
      <a href="home.html" class="menu-item" id="home">Home</a>
      <a href="biography.html" class="menu-item" id="bio">Biography</a>
      <a href="collections.html" class="menu-item" id="coll">Collections</a>
      <a href="contact.html" class="menu-item" id="contact">Contact</a>
    </nav>
  </header>

  <div class="contact-hero">
    <div class="frame">
      <main class="contact-wrap">
        <div class="contact-item">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M20 6v12H4V6h16zm-8 7l8-5H4l8 5z"/>
          </svg>
          <a href="mailto:mailbox.bahman@gmail.com">mailbox.bahman@gmail.com</a>
        </div>

        <div class="contact-item">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm10 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm-5 1.5A4.5 4.5 0 1 1 7.5 11 4.5 4.5 0 0 1 12 6.5zm0 1.5a3 3 0 1 0 3 3 3 3 0 0 0-3-3z"/>
          </svg>
          <a href="https://www.instagram.com/bahmanazad/" target="_blank" rel="noopener noreferrer">Instagram</a>
        </div>
      </main>
    </div>
  </div>

  <script>
    const currentPage = window.location.pathname;
    if (currentPage.includes('home.html') || currentPage === '/' || currentPage === '') {
      document.getElementById('home').classList.add('active');
    } else if (currentPage.includes('biography')) {
      document.getElementById('bio').classList.add('active');
    } else if (currentPage.includes('collections')) {
      document.getElementById('coll').classList.add('active');
    } else if (currentPage.includes('contact')) {
      document.getElementById('contact').classList.add('active');
    }
  </script>

</body>
</html>
