<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B.K.A | Coexistence — 2020</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .coll-intro{
      max-width:640px;
      margin:0 auto 50px;
      padding:0 24px;
      text-align:center;
    }
    .coll-intro .title{
      font-family:var(--serif);
      font-size:34px;
      font-weight:600;
      margin:0 0 4px;
    }
    .coll-intro .meta{
      color:var(--clay);
      font-size:14px;
      margin:0 0 20px;
    }
    .coll-intro p{
      font-size:15px;
      line-height:1.8;
      color:#3a332c;
      margin:0;
    }
    .gallery{
      max-width:1000px;
      margin:0 auto;
      padding:0 24px;
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:28px;
    }
    figure{ margin:0; }
    figure img{
      width:100%;
      height:auto;
      display:block;
      box-shadow:0 20px 36px -22px rgba(23,19,16,0.4);
    }
    figcaption{
      margin-top:10px;
      font-size:13px;
      color:var(--clay);
    }
    @media (max-width:768px){
      .gallery{ grid-template-columns:repeat(2, 1fr); gap:20px; }
    }
    @media (max-width:480px){
      .gallery{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <h1 class="mark">B.K.A</h1>
    <p class="byline">Bahman Kiani Azad</p>
    <p class="role">Painter</p>
    <hr class="header-rule">
    <nav class="site-nav">
      <a href="home.html" class="menu-item" id="home">Home</a>
      <a href="biography.html" class="menu-item" id="bio">Biography</a>
      <a href="collections.html" class="menu-item" id="coll">Collections</a>
      <a href="contact.html" class="menu-item" id="contact">Contact</a>
    </nav>
  </header>

  <div class="coll-intro">
    <p class="title">Coexistence</p>
    <p class="meta">Acrylic on canvas — 2020</p>
    <p>Figures and animals sharing the same ground — a study in shared space, weight, and quiet company.</p>
  </div>

  <div class="gallery">
    <figure><img src="assets/2020-1.jpg" alt="Coexistence, 2020, work 1"><figcaption>Coexistence, Acrylic on canvas, 2020</figcaption></figure>
    <figure><img src="assets/2020-2.jpg" alt="Coexistence, 2020, work 2"><figcaption>Coexistence, Acrylic on canvas, 2020</figcaption></figure>
    <figure><img src="assets/2020-3.jpg" alt="Coexistence, 2020, work 3"><figcaption>Coexistence, Acrylic on canvas, 2020</figcaption></figure>
    <figure><img src="assets/2020-4.jpg" alt="Coexistence, 2020, work 4"><figcaption>Coexistence, Acrylic on canvas, 100 × 170 cm, 2020</figcaption></figure>
    <figure><img src="assets/2020-5.JPG" alt="Coexistence, 2020, work 5"><figcaption>Coexistence, Acrylic on canvas, 40 × 50 cm, 2020</figcaption></figure>
  </div>

  <div style="height:70px"></div>

  <script>
    const currentPage = window.location.pathname;
    if (currentPage.includes('home.html') || currentPage === '/' || currentPage === '') {
      document.getElementById('home').classList.add('active');
    } else if (currentPage.includes('biography')) {
      document.getElementById('bio').classList.add('active');
    } else if (currentPage.includes('collections') || currentPage.includes('2020')) {
      document.getElementById('coll').classList.add('active');
    } else if (currentPage.includes('contact')) {
      document.getElementById('contact').classList.add('active');
    }
  </script>

</body>
</html>
